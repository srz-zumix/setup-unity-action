name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action (Dry Run)
        id: test-action
        uses: ./
        with:
          version: 6000.0.47f1
          module: android
          child-modules: 'true'
          dry-run: 'true'
          format: json
          install-path: ${{ runner.temp }}/Unity Editors

      - name: Verify CLI on PATH
        id: cli-version
        run: unity --version

  test-install:
    name: Unity Editor Installation Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UNITY_TEST_VERSION: 6000.0.47f1

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Install Unity Editor
        id: install
        uses: ./
        with:
          version: ${{ env.UNITY_TEST_VERSION }}
          accept-eula: 'true'
          dry-run: 'false'
          format: json
          install-path: ${{ runner.temp }}/Unity Editors

      - name: Verify Installed Editor Files
        id: verify
        shell: bash
        run: >-
          unity editors verify "$UNITY_TEST_VERSION" --non-interactive
          --no-banner --format json
